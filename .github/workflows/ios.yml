name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    name: Build iOS IPA (unsigned - sign with 3uTools)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Select Xcode 26.5 (matches .NET iOS SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios ios

      - name: Restore (iOS only)
        run: dotnet restore POSPrinter.csproj /p:TargetFrameworks=net9.0-ios

      - name: Build iOS .app (unsigned)
        run: |
          dotnet build POSPrinter.csproj \
            -f net9.0-ios \
            -c Release \
            /p:TargetFrameworks=net9.0-ios \
            /p:RuntimeIdentifier=ios-arm64 \
            /p:PlatformTarget=arm64 \
            /p:CodesignKey="" \
            /p:CodesignProvision="" \
            /p:EnableCodeSigning=false \
            /p:ArchiveOnBuild=false \
            /p:_RequireCodeSigning=false

      - name: Package .app → IPA
        run: |
          APP_PATH=$(find bin/Release/net9.0-ios -name "*.app" | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r POSPrinter.ipa Payload/
          echo "IPA created: $(ls -lh POSPrinter.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: POSPrinter-iOS-unsigned
          path: POSPrinter.ipa
          if-no-files-found: error
